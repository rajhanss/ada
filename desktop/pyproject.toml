[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-desktop"
version = "0.1.0"
description = "ADA — Autonomous Digital Assistant — Windows Desktop Companion"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.8",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "websockets>=13",
  "mss>=9.0",
  "Pillow>=10.4",
  "edge-tts>=6.1",
  "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[project.scripts]
ada = "ada_desktop.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ada_desktop*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
