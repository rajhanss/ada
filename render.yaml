# Render.com deployment manifest
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ada-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free              # Free tier supported (no credit card required)
    region: oregon          # choose region closest to users
    branch: main
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # --- App Environment ---
      - key: ADA_ENVIRONMENT
        value: production
      - key: ADA_DEBUG
        value: "false"
      - key: ADA_LOG_LEVEL
        value: "INFO"

      # --- JWT Secret ---
      - key: ADA_JWT_SECRET
        generateValue: true

      # --- AI Providers (paste your keys in Render Dashboard -> Environment) ---
      - key: ADA_GEMINI_API_KEY
        value: ""
      - key: ADA_GOOGLE_API_KEY
        value: ""
      - key: ADA_GROQ_API_KEY
        value: ""
      - key: ADA_OPENROUTER_API_KEY
        value: ""
      - key: ADA_ANTHROPIC_API_KEY
        value: ""

      # --- Optional Supabase / Storage ---
      - key: ADA_SUPABASE_URL
        value: ""
      - key: ADA_SUPABASE_SERVICE_ROLE_KEY
        value: ""
      - key: ADA_SUPABASE_ANON_KEY
        value: ""

      # --- Observability & Agentic Evals ---
      - key: LANGCHAIN_TRACING_V2
        value: "false"
      - key: LANGCHAIN_API_KEY
        value: ""
      - key: LANGCHAIN_PROJECT
        value: "ada-production"

      # --- CORS ---
      - key: ADA_CORS_ORIGINS
        value: "*"
